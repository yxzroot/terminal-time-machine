name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove secrets, personal paths, and private file contents before submitting."
  - type: input
    id: version
    attributes:
      label: Terminal Time Machine version
      description: Include the output of `tt --version` and the installation method.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Provide the smallest command sequence that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
